name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 --jobs=1 .
      - name: Type check
        run: |
          mypy --ignore-missing-imports .
      - name: Run tests
        run: pytest -q

  firmware-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check firmware sources exist
        run: |
          test -f main/main.cpp
          test -f main/mesh_codec.cpp
          test -f main/mavlink_min.cpp
          test -f sdkconfig.defaults
          test -f CMakeLists.txt
          grep -q 'project(meshswarm)' CMakeLists.txt
          grep -q idf_component_register main/CMakeLists.txt
          test ! -f scripts/provisioning_private.pem
          if grep -n 'ALLOW_INSECURE' sdkconfig.defaults CMakeLists.txt main/CMakeLists.txt; then
            echo 'ALLOW_INSECURE compile flags must not be enabled by default' >&2
            exit 1
          fi
